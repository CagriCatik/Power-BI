[project]
site_name        = "Power BI"
site_description = "Learn Microsoft Power BI from first steps to advanced reporting, DAX, and publishing."
site_author      = "Çağrı"
repo_url         = "https://github.com/CagriCatik/Power-BI"
repo_name        = "CagriCatik/Power-BI"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
name     = "material"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "navigation.tabs",
  "navigation.indexes",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "header.autohide",
  "toc.follow",
  "palette.toggle",
]

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "amber"
accent      = "amber"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "amber"
accent      = "amber"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Extra
# ---------------------------------------------------------------------------
[project.extra]
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/CagriCatik/Power-BI" },
]

extra_css = ["styles/extra.css"]

